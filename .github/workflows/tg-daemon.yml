name: TG Daemon

permissions:
  contents: write

on:
  schedule:
    - cron: '15 */6 * * *'
  workflow_dispatch:

jobs:
  daemon:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4
      - name: Run daemon
        env:
          TG_TOKEN: "8779284317:AAG0ZfiieopkK1bsu8TGwoH8QMj6jNrHzvY"
        run: |
          python3 << 'PYEOF'
import json, time, urllib.request, urllib.error, os, base64, sys

TOKEN = os.environ["TG_TOKEN"]
GH_TOKEN = "${{ secrets.GITHUB_TOKEN }}"
REPO = "${{ github.repository }}"
API_BASE = f"https://api.github.com/repos/{REPO}"

def gh_get(path):
    url = f"{API_BASE}/{path}"
    req = urllib.request.Request(url, headers={"Authorization": f"Bearer {GH_TOKEN}", "Accept": "application/vnd.github.v3.raw"})
    try:
        with urllib.request.urlopen(req, timeout=10) as r:
            return r.read().decode()
    except urllib.error.HTTPError as e:
        if e.code == 404: return None
        return None
    except: return None

def gh_put(path, content, msg="auto"):
    url = f"{API_BASE}/contents/{path}"
    b64 = base64.b64encode(content.encode()).decode()
    sha = None
    try:
        req = urllib.request.Request(url, headers={"Authorization": f"Bearer {GH_TOKEN}", "Accept": "application/vnd.github.v3+json"})
        with urllib.request.urlopen(req, timeout=10) as r:
            sha = json.loads(r.read()).get("sha")
    except: pass
    data = {"message": msg, "content": b64}
    if sha: data["sha"] = sha
    req = urllib.request.Request(url, data=json.dumps(data).encode(), method="PUT",
        headers={"Authorization": f"Bearer {GH_TOKEN}", "Content-Type": "application/json"})
    try:
        with urllib.request.urlopen(req, timeout=10) as r:
            return json.loads(r.read())
    except: return None

def tg(method, path, body=None):
    url = f"https://api.telegram.org/bot{TOKEN}/{path}"
    data = json.dumps(body).encode() if body else None
    req = urllib.request.Request(url, data=data, method=method, headers={"Content-Type": "application/json"})
    try:
        with urllib.request.urlopen(req, timeout=15) as r:
            return json.loads(r.read())
    except Exception as e:
        return {"ok": False, "error": str(e)}

bot = tg("GET", "getMe")
print(f"[Daemon] Bot: {bot.get('result',{}).get('username','?')}")
start = time.time()
last_update_id = 0

while time.time() - start < 21500:
    time.sleep(2)
    
    # Check for commands from server
    raw = gh_get("contents/proxy/daemon/command.json")
    if raw:
        try:
            cmd = json.loads(raw)
            if cmd.get("rid") == "waiting":
                # New command
                rid = str(int(time.time()))
                print(f"[D] Cmd: {cmd.get('a')} {cmd.get('p','')[:40]}")
                r = tg(cmd.get("m","GET"), cmd.get("p",""), cmd.get("b"))
                gh_put("proxy/daemon/response.json", json.dumps(r), f"resp {rid}")
                gh_put("proxy/daemon/command.json", json.dumps({"rid": rid}), f"done {rid}")
        except: pass
    
    # Process incoming messages (bot replies)
    updates = tg("GET", "getUpdates", {"offset": last_update_id + 1, "timeout": 5})
    if updates and updates.get("ok"):
        for u in updates.get("result", []):
            last_update_id = u["update_id"]
            chat_id = u.get("message",{}).get("chat",{}).get("id")
            text = u.get("message",{}).get("text","")
            name = u.get("message",{}).get("from",{}).get("first_name","")
            if chat_id:
                print(f"[D] From {name}: {text[:60]}")
                if "/start" in text:
                    tg("POST", "sendMessage", {
                        "chat_id": chat_id,
                        "text": "سلام! 👋\n\nبه فروشگاه رسمی xTool خوش آمدید!\nما دستگاه‌های حکاکی و برش لیزر را مستقیماً از کارخانه چین به ایران ارسال می‌کنیم.\n\n✅ قیمت کارخانه (بدون واسطه)\n✅ ارسال به ایران (۲۰-۳۸ روز)\n✅ پرداخت با USDT\n\nبرای مشاهده محصولات /products را بزنید."
                    })

print("[Daemon] Stopped")
PYEOF